<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Zico Rush – Leaderboard</title>
    <!-- PWA -->
    <link rel="manifest" href="manifest.json" />
    <meta name="theme-color" content="#09090b" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Zico Rush" />
    <link rel="apple-touch-icon" href="assets/sprites/logos.png" />
    <meta name="description" content="Zico Rush GameFi leaderboard – top players by points." />
    <link rel="stylesheet" href="css/style.css" />
    <link rel="icon" href="assets/sprites/logos.png" />
    <!-- Supabase JS -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- Phosphor Icons -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <!-- Reown AppKit for Multi-Wallet Support -->
    <script type="module" src="js/appkit-init.js"></script>
    <!-- Ethers v6 for wallet support -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/6.11.1/ethers.umd.min.js"></script>
    <style>
        .lb-container {
            position: relative;
            z-index: 1;
            max-width: 600px;
            margin: 0 auto;
            padding: 85px 1rem 4rem;
        }

        .lb-hero {
            text-align: center;
            margin: 1.5rem 0 1.25rem;
        }

        .lb-hero h1 {
            font-family: 'Orbitron', monospace;
            font-size: 1.6rem;
            font-weight: 900;
            background: linear-gradient(135deg, #f59e0b, #a855f7);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .lb-hero p {
            color: #64748b;
            font-size: 0.8rem;
            margin-top: 0.3rem;
        }

        .lb-card {
            background-image: url('assets/sprites/cards2.png');
            background-size: 100% 100%;
            background-position: center;
            background-repeat: no-repeat;
            background-color: transparent;
            border: none;
            border-radius: 0;
            box-shadow: none;
            overflow: hidden;
            padding: 1.5rem 0.5rem 1rem;
        }

        .lb-header {
            display: grid;
            grid-template-columns: 50px 1fr 90px 80px;
            gap: 0.5rem;
            padding: 1rem 1.25rem;
            background: rgba(139, 92, 246, 0.05);
            border-bottom: 1px solid rgba(0, 0, 0, 0.08);
            font-size: 0.75rem;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: #475569;
        }

        .lb-row {
            display: grid;
            grid-template-columns: 50px 1fr 90px 80px;
            gap: 0.5rem;
            padding: 0.85rem 1.25rem;
            border-bottom: 1px solid rgba(0, 0, 0, 0.05);
            align-items: center;
            transition: all 0.2s ease;
        }

        .lb-row:hover {
            background: rgba(139, 92, 246, 0.08);
        }

        .lb-row.me {
            background: rgba(139, 92, 246, 0.15);
            border-left: 4px solid #8b5cf6;
        }

        .lb-row:last-child {
            border-bottom: none;
        }

        .rank-badge {
            font-family: 'Orbitron', monospace;
            font-weight: 700;
            font-size: 0.9rem;
            text-align: center;
        }

        .rank-badge.r1 {
            color: #ffd700;
            text-shadow: 0 0 12px #ffd70066;
        }

        .rank-badge.r2 {
            color: #c0c0c0;
        }

        .rank-badge.r3 {
            color: #cd7f32;
        }

        .rank-badge.rn {
            color: #1e293b;
            font-size: 0.8rem;
        }

        .player-col .uname {
            font-size: 0.875rem;
            font-weight: 500;
            color: #0f172a;
        }

        .player-col .waddr {
            font-size: 0.65rem;
            color: #000;
            font-family: monospace;
            margin-top: 1px;
        }

        .pts-col {
            font-family: 'Orbitron', monospace;
            font-size: 0.875rem;
            font-weight: 700;
            color: #7c3aed;
            text-align: right;
        }

        .level-col {
            font-size: 0.8rem;
            color: #000;
            text-align: right;
        }

        .top3-bar {
            display: flex;
            gap: 0.75rem;
            margin-bottom: 1rem;
        }

        .top3-item {
            flex: 1;
            background-image: url('assets/sprites/box2.png');
            background-size: 100% 100%;
            background-position: center;
            background-repeat: no-repeat;
            background-color: transparent;
            border-radius: 0;
            padding: 2.8rem 0.5rem 1.2rem;
            text-align: center;
            border: none;
            box-shadow: none;
            transition: transform 0.3s ease;
        }

        .top3-item:hover {
            transform: translateY(-5px);
        }

        .top3-item.place1 {
            flex: 1.15;
        }



        .top3-medal {
            font-size: 1.6rem;
            display: block;
        }

        .top3-name {
            font-size: 0.78rem;
            font-weight: 600;
            margin-top: 0.3rem;
            color: #e2e8f0;
        }

        .top3-pts {
            font-family: 'Orbitron', monospace;
            font-size: 0.9rem;
            font-weight: 700;
            color: #a855f7;
            margin-top: 0.2rem;
        }

        .stats-row {
            display: flex;
            gap: 0.75rem;
            margin-bottom: 1rem;
        }

        .stat-chip {
            flex: 1;
            background-image: url('assets/sprites/box2.png');
            background-size: 100% 100%;
            background-position: center;
            background-repeat: no-repeat;
            background-color: transparent;
            border-radius: 0;
            padding: 2.2rem 0.5rem 1rem;
            text-align: center;
            border: none;
            box-shadow: none;
        }

        .stat-chip .val {
            font-family: 'Orbitron', monospace;
            font-weight: 700;
            font-size: 1rem;
            color: #a855f7;
        }

        .stat-chip .lbl {
            font-size: 0.65rem;
            color: #64748b;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            margin-top: 0.15rem;
        }

        .btn-back {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            color: #64748b;
            text-decoration: none;
            font-size: 0.8rem;
            transition: color 0.2s;
            margin-bottom: 1rem;
        }

        .btn-back:hover {
            color: #a855f7;
        }

        .loading-lb {
            text-align: center;
            padding: 3rem;
            color: #475569;
            font-family: 'Orbitron', monospace;
            font-size: 0.85rem;
        }

        .my-rank-banner {
            background: rgba(168, 85, 247, 0.1);
            border: 1px solid rgba(168, 85, 247, 0.3);
            border-radius: 10px;
            padding: 0.6rem 1rem;
            margin-bottom: 1rem;
            display: none;
            font-size: 0.82rem;
            color: #c084fc;
            text-align: center;
        }

        .refresh-btn {
            background: none;
            border: 1px solid rgba(124, 58, 237, 0.3);
            border-radius: 8px;
            color: #7c3aed;
            font-size: 0.75rem;
            padding: 0.35rem 0.75rem;
            cursor: pointer;
            font-family: 'Orbitron', monospace;
            transition: all 0.2s;
        }

        .refresh-btn:hover {
            background: rgba(124, 58, 237, 0.15);
        }
        /* ───── NAVBAR ───── */
        .navbar {
            position: fixed;
            top: 0; left: 0; right: 0; z-index: 100;
            display: flex; align-items: center; justify-content: space-between;
            padding: 0 2rem; height: 60px;
            background: url('assets/sprites/header.png') no-repeat center center;
            background-size: cover; border-bottom: 2px solid #1e293b;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.6);
            font-family: 'Space Grotesk', sans-serif;
        }
        .nav-brand { display: flex; align-items: center; gap: 0.6rem; text-decoration: none; }
        .nav-brand .brand-icon { font-size: 1.6rem; filter: drop-shadow(0 0 10px #4fc3f7); }
        .nav-brand .brand-text { font-size: 1rem; font-weight: 900; color: #e0e0e0; letter-spacing: 0.05em; }
        
        .nav-links { display: flex; align-items: center; gap: 1rem; }
        .nav-link { display: flex; align-items: center; gap: 0.4rem; padding: 0.5rem 1rem; font-size: 0.8rem; font-weight: 700; color: #94a3b8; text-decoration: none; border-radius: 8px; transition: all 0.2s; }
        .nav-link:hover { color: #fff; background: rgba(255, 255, 255, 0.05); }
        .nav-link.active { color: #ffb300; background: rgba(255, 179, 0, 0.1); border: 1px solid rgba(255, 179, 0, 0.2); }
        .nav-link .nav-icon { font-size: 1rem; color: #ffb300; }
        
        .nav-wallet-badge { display: flex; align-items: center; gap: 0.5rem; padding: 0.4rem 1rem; background: rgba(34, 197, 94, 0.1); border: 1px solid rgba(34, 197, 94, 0.4); border-radius: 6px; font-size: 0.75rem; font-weight: 700; color: #22c55e; font-family: 'VT323', monospace; letter-spacing: 1px; cursor: pointer; }
        .nav-wallet-badge .dot { width: 8px; height: 8px; background: #22c55e; border-radius: 50%; box-shadow: 0 0 8px #22c55e; }
        .nav-wallet-badge .disconnect-icon { margin-left: 0.5rem; padding: 2px; border-radius: 4px; transition: all 0.2s; color: #ff4b91; display: none; font-size: 1rem; }
        .nav-wallet-badge .disconnect-icon:hover { background: rgba(239, 68, 68, 0.15); transform: scale(1.1); }
        
        .nav-mobile-links { display: none; align-items: center; gap: 1rem; }
        @media(max-width: 768px) {
            .nav-links { display: none; }
            .nav-mobile-links { display: flex; }
            .nav-brand .brand-text { font-size: 0.8rem; }
            .navbar { padding: 0 1rem; }
            .nav-wallet-badge { padding: 0.3rem 0.6rem; font-size: 0.65rem; }
        }
        @media (max-width: 480px) {
            .navbar { height: 52px; padding: 0 0.75rem; }
            .nav-brand .brand-icon { font-size: 1.3rem; }
            .nav-brand .brand-text { font-size: 0.7rem; }
            .nav-mobile-link { font-size: 1.1rem; }
            .nav-wallet-badge { padding: 0.25rem 0.5rem; font-size: 0.6rem; }
            .nav-wallet-badge .dot { width: 6px; height: 6px; }
        }
    </style>
</head>

<body>
    <div class="bg-animated"></div>
    <div class="stars" id="starsContainer"></div>

    <!-- ───── NAVBAR ───── -->
    <nav class="navbar">
        <a href="index.html" class="nav-brand">
            <span class="brand-text">ZICO RUSH</span>
        </a>

        <div class="nav-links">
            <a href="index.html" class="nav-link"><i class="ph-fill ph-house"></i> Home</a>
            <a href="game.html" class="nav-link"><i class="ph-fill ph-game-controller"></i> Play</a>
            <a href="leaderboard.html" class="nav-link active"><i class="ph-fill ph-trophy"></i> Leaderboard</a>
            <a href="quest.html" class="nav-link"><i class="ph-fill ph-user"></i> Quest</a>
        </div>

        <div class="nav-wallet-badge" id="navWalletBtn" onclick="connectWallet()">
            <div class="dot"></div>
            <span id="navWalletText">Connect</span>
            <i class="ph-bold ph-sign-out disconnect-icon" id="navDisconnectIcon" onclick="event.stopPropagation(); window.onWalletDisconnectUI();" title="Disconnect"></i>
        </div>

        <div class="nav-mobile-links" style="border-bottom: none;">
            <a href="index.html" class="nav-mobile-link" style="border-bottom: none; text-decoration: none;"><i class="ph-fill ph-house" style="color:#94a3b8;"></i></a>
            <a href="game.html" class="nav-mobile-link" style="border-bottom: none; text-decoration: none;"><i class="ph-fill ph-game-controller" style="color:#94a3b8;"></i></a>
            <a href="leaderboard.html" class="nav-mobile-link" style="border-bottom: none; text-decoration: none;"><i class="ph-fill ph-trophy" style="color:#ffb300;"></i></a>
            <a href="quest.html" class="nav-mobile-link" style="border-bottom: none; text-decoration: none;"><i class="ph-fill ph-user" style="color:#94a3b8;"></i></a>
        </div>
    </nav>

    <div class="lb-container">

        <div class="lb-hero">
            <div
                style="font-size:3.5rem; margin-bottom:0.4rem; background: linear-gradient(135deg, #f59e0b, #a855f7); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; filter: drop-shadow(0 4px 15px rgba(245, 158, 11, 0.4));">
                <i class="ph-fill ph-trophy"></i>
            </div>
            <h1>LEADERBOARD</h1>
            <p>Top Zico Rush players this season</p>
        </div>

        <!-- Global Stats -->
        <div class="stats-row" id="globalStats">
            <div class="stat-chip">
                <div class="val" id="gs_players">—</div>
                <div class="lbl">Players</div>
            </div>
            <div class="stat-chip">
                <div class="val" id="gs_diamonds">—</div>
                <div class="lbl">Coins</div>
            </div>
            <div class="stat-chip">
                <div class="val" id="gs_points">—</div>
                <div class="lbl">Total Points</div>
            </div>
        </div>

        <!-- My Rank Banner -->
        <div class="my-rank-banner" id="myRankBanner"></div>

        <!-- Top 3 Podium -->
        <div class="top3-bar" id="top3Bar" style="display:none">
            <div class="top3-item place2" id="top2">
                <span class="top3-medal">🥈</span>
                <div class="top3-name" id="t2name">—</div>
                <div class="top3-pts" id="t2pts">0</div>
            </div>
            <div class="top3-item place1" id="top1">
                <span class="top3-medal">🥇</span>
                <div class="top3-name" id="t1name">—</div>
                <div class="top3-pts" id="t1pts">0</div>
            </div>
            <div class="top3-item place3" id="top3">
                <span class="top3-medal">🥉</span>
                <div class="top3-name" id="t3name">—</div>
                <div class="top3-pts" id="t3pts">0</div>
            </div>
        </div>

        <!-- Leaderboard Table -->
        <div class="lb-card">
            <div class="lb-header"
                style="display:flex; justify-content:space-between; align-items:center; padding:0.75rem 1rem;">
                <span>LEADERBOARD – TOP 50</span>
                <button class="refresh-btn" onclick="loadLeaderboard()">↻ Refresh</button>
            </div>
            <div class="lb-header" style="background:none; border-top:none;">
                <div>#</div>
                <div>Player</div>
                <div style="text-align:right">Points</div>
                <div style="text-align:right">Level</div>
            </div>
            <div id="lbBody">
                <div class="loading-lb">⟳ Loading players...</div>
            </div>
        </div>

        <div style="text-align:center; margin-top:1rem;">
            <a href="game.html" style="display:inline-block; padding:0.75rem 2rem;
      background:linear-gradient(135deg,#a855f7,#7c3aed); border-radius:12px;
      color:white; text-decoration:none; font-family:'Orbitron',monospace;
      font-size:0.85rem; font-weight:700; box-shadow:0 4px 20px rgba(168,85,247,0.4);">
                ⚡ PLAY NOW
            </a>
        </div>
    </div>

    <script src="js/supabase.js"></script>
    <script>
        const myWallet = localStorage.getItem('dr_wallet') || '';
        window.walletState = {
            connected: !!myWallet,
            wallet: myWallet,
            username: localStorage.getItem('dr_username') || null
        };

        // Stars
        const sc = document.getElementById('starsContainer');
        for (let i = 0; i < 60; i++) {
            const s = document.createElement('div');
            s.className = 'star';
            s.style.cssText = `left:${Math.random() * 100}%;top:${Math.random() * 100}%;--d:${(Math.random() * 3 + 1).toFixed(1)}s;opacity:${Math.random() * 0.4 + 0.1}`;
            sc.appendChild(s);
        }

        function fmtNum(n) {
            if (!n) return '0';
            if (n >= 1e6) return (n / 1e6).toFixed(1) + 'M';
            if (n >= 1e3) return (n / 1e3).toFixed(1) + 'K';
            return String(n);
        }

        async function loadStats() {
            try {
                // Fetch stats from Supabase directly
                const { data, error, count } = await supabaseClient
                    .from('profiles')
                    .select('points, diamonds_collected', { count: 'exact' });

                if (error) throw error;

                let totalPoints = 0;
                let totalDiamonds = 0;

                data.forEach(p => {
                    totalPoints += (p.points || 0);
                    totalDiamonds += (p.diamonds_collected || 0);
                });

                document.getElementById('gs_players').textContent = fmtNum(count || 0);
                document.getElementById('gs_diamonds').textContent = fmtNum(totalDiamonds);
                document.getElementById('gs_points').textContent = fmtNum(totalPoints);
            } catch (e) {
                console.warn('Stats error:', e);
            }
        }

        async function loadLeaderboard() {
            document.getElementById('lbBody').innerHTML = '<div class="loading-lb">⟳ Loading...</div>';
            try {
                const { data: players, error } = await supabaseClient
                    .from('profiles')
                    .select('*')
                    .order('points', { ascending: false })
                    .limit(50);

                if (error) throw error;

                // Assign visual ranks manually since order is guaranteed
                players.forEach((p, idx) => p.rank = idx + 1);

                // Podium
                if (players.length >= 3) {
                    document.getElementById('top3Bar').style.display = 'flex';
                    document.getElementById('t1name').textContent = players[0]?.username || '—';
                    document.getElementById('t1pts').textContent = fmtNum(players[0]?.points || 0);
                    document.getElementById('t2name').textContent = players[1]?.username || '—';
                    document.getElementById('t2pts').textContent = fmtNum(players[1]?.points || 0);
                    document.getElementById('t3name').textContent = players[2]?.username || '—';
                    document.getElementById('t3pts').textContent = fmtNum(players[2]?.points || 0);
                }

                if (players.length === 0) {
                    document.getElementById('lbBody').innerHTML = '<div class="loading-lb">No players yet. Be the first! 🚀</div>';
                    return;
                }

                let html = '';
                players.forEach((p, i) => {
                    const isMe = myWallet && p.wallet && p.wallet.startsWith(myWallet.slice(0, 6).toLowerCase());
                    const rankClass = i === 0 ? 'r1' : i === 1 ? 'r2' : i === 2 ? 'r3' : 'rn';
                    const rankIcon = i === 0 ? '🥇' : i === 1 ? '🥈' : i === 2 ? '🥉' : `#${p.rank}`;

                    if (isMe) {
                        const banner = document.getElementById('myRankBanner');
                        banner.textContent = `🎯 You are ranked #${p.rank} with ${fmtNum(p.points)} points`;
                        banner.style.display = 'block';
                    }

                    html += `<div class="lb-row ${isMe ? 'me' : ''}">
          <div class="rank-badge ${rankClass}">${rankIcon}</div>
          <div class="player-col">
            <div class="uname">${escHtml(p.username)} ${isMe ? '⭐' : ''}</div>
            <div class="waddr">${p.wallet ? escHtml(p.wallet.slice(0, 6) + '...' + p.wallet.slice(-4)) : '—'}</div>
          </div>
          <div class="pts-col">${fmtNum(p.points)}</div>
          <div class="level-col">Lv.${p.level || 1}</div>
        </div>`;
                });
                document.getElementById('lbBody').innerHTML = html;
            } catch (e) {
                document.getElementById('lbBody').innerHTML = '<div class="loading-lb">⚠️ Could not load data. Is the server running?</div>';
            }
        }

        function escHtml(str) {
            const d = document.createElement('div');
            d.textContent = str || '—';
            return d.innerHTML;
        }

        loadStats();
        loadLeaderboard();
        // Auto refresh every 30 seconds
        setInterval(() => { loadStats(); loadLeaderboard(); }, 30000);

        // ── ANTI-CHEAT / ANTI-INSPECT ──
        // Mencegah klik kanan
        document.addEventListener('contextmenu', event => event.preventDefault());

        // Mencegah shortcut DevTools
        document.onkeydown = function (e) {
            if (e.keyCode == 123) return false; // F12
            if (e.ctrlKey && e.shiftKey && e.keyCode == 73) return false; // Ctrl+Shift+I
            if (e.ctrlKey && e.shiftKey && e.keyCode == 74) return false; // Ctrl+Shift+J
            if (e.ctrlKey && e.keyCode == 85) return false; // Ctrl+U
        };
    </script>

    <!-- Service Worker Registration -->
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js')
                    .then(reg => console.log('SW registered:', reg.scope))
                    .catch(err => console.warn('SW registration failed:', err));
            });
        }
    </script>
</body>

</html>
